services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fashionstore-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-FashionStore@2026!}"
      MSSQL_PID: "Express"
    ports:
      - "${MSSQL_PORT:-14333}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./database:/docker-sql:ro
    healthcheck:
      test: ["CMD-SHELL", "(/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 25s
    networks:
      - fashionstore-net

  backend:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: fashionstore-backend
    restart: unless-stopped
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      DB_URL: "jdbc:sqlserver://mssql:1433;databaseName=FashionStoreDB;encrypt=true;trustServerCertificate=true"
      DB_USERNAME: "sa"
      DB_PASSWORD: "${SA_PASSWORD:-FashionStore@2026!}"
      JWT_SECRET: "${JWT_SECRET:-FashionStoreProdSecretKey2026ChangeMeTo64RandomChars998877665544}"
      JWT_EXPIRATION_MS: "${JWT_EXPIRATION_MS:-86400000}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.5-flash}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:8088,http://localhost:5173}"
      APP_UPLOAD_DIR: "/app/uploads"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - fashionstore-net

  frontend:
    build:
      context: ./frontend-vue
      dockerfile: Dockerfile
    container_name: fashionstore-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    networks:
      - fashionstore-net

volumes:
  mssql_data:
  uploads_data:

networks:
  fashionstore-net:
    driver: bridge
