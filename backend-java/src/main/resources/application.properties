# ==============================================================================
# FASHION STORE APPLICATION PROPERTIES - SPRING BOOT 3
# ==============================================================================

server.port=${PORT:8080}
server.address=0.0.0.0

# UTF-8 Encoding Configuration (Bắt buộc cho tiếng Việt)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Microsoft SQL Server Configuration
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=FashionStoreDB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate & JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=${APP_UPLOAD_DIR:./uploads}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://dart-married-cabana.ngrok-free.dev}

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:FashionStoreSecretKey2026SuperSecureAndLongKeyForJwtSignatureValidation998877}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# VietQR Configuration
app.vietqr.bank-id=MB
app.vietqr.account-no=0123456789
app.vietqr.account-name=NGUYEN VAN PHAT

# Gemini AI Assistant Configuration (tùy chọn - để trống sẽ dùng rule-based mặc định)
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# Springdoc OpenAPI Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha


spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl